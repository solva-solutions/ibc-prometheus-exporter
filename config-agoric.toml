# ──────────────────────────────────────────────────────────────────────────────
# IBC Prometheus Exporter config — Agoric SA
# Home chain  : agoric-3
# Counterparties: osmosis-1, cosmoshub-4, neutron-1, axelar-dojo-1, noble-1,
#                 core-1 (Persistence), kava_2222-10, secret-4
# ──────────────────────────────────────────────────────────────────────────────

# ════════════════════════════════════════════════════════════
# HOME CHAIN
# ════════════════════════════════════════════════════════════

[[chains]]
name = "agoric"
chain_id = "agoric-3"
rpcs = [""]
rests = [
    "https://main.api.agoric.net:443"
]
home_chain = true
whitelist_clients = [
    "07-tendermint-1",    # → osmosis-1
    "07-tendermint-6",    # → cosmoshub-4
    "07-tendermint-11",   # → axelar-dojo-1
    "07-tendermint-77",   # → noble-1
    "07-tendermint-78",   # → kava_2222-10
    "07-tendermint-93",   # → core-1
    "07-tendermint-101",  # → neutron-1
]
blacklist_clients = []
whitelist_connections = []
blacklist_connections = []
whitelist_channels = []
blacklist_channels = []
state_refresh_interval = 1200
state_scan_timeout = 600

[chains.excluded_sequences]
channel-1  = ["114800-118396"]  # agoric-3 → osmosis-1
channel-9  = [11768]            # agoric-3 → axelar-dojo-1
channel-62 = ["1-3421"]         # agoric-3 → noble-1

