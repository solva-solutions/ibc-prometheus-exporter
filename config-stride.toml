# ──────────────────────────────────────────────────────────────────────────────
# IBC Prometheus Exporter config — Stride SA
# Home chain  : stride-1
# Counterparties (from hermes-config-stride.toml):
#   cosmoshub-4, osmosis-1, injective-1, juno-1, secret-4, phoenix-1,
#   neutron-1, agoric-3, dydx-mainnet-1, celestia, ssc-1, laozi-mainnet
#
# Hermes extra non-stride paths (osmosis-band, osmosis-neutron) are omitted:
# this exporter scans from stride as home.
#
# Expired canonical clients (queried 2026-10-02; recovery still required):
#   stride-1       07-tendermint-129  Expired   tracks agoric-3
#   agoric-3       07-tendermint-74   Expired   tracks stride-1
#   laozi-mainnet  07-tendermint-169  Expired   tracks stride-1
# stride-1 07-tendermint-146 (tracks laozi-mainnet) is Active.
# ──────────────────────────────────────────────────────────────────────────────

# ════════════════════════════════════════════════════════════
# HOME CHAIN
# ════════════════════════════════════════════════════════════

[[chains]]
name = "stride"
chain_id = "stride-1"
rpcs = [
    "https://s1.solva.solutions:8443/solva-internal/stride/rpc"
]
rests = [
    "https://stride-api.polkachu.com",
    "https://rest.lavenderfive.com:443/stride",
]
home_chain = true
# Canonical clients on stride-1 for hermes-relayed counterparties
whitelist_clients = [
    "07-tendermint-0",    # → cosmoshub-4     (channel-0)
    "07-tendermint-1",    # → osmosis-1       (channel-5)
    "07-tendermint-2",    # → injective-1     (channel-6)
    "07-tendermint-31",   # → juno-1          (channel-24)
    "07-tendermint-37",   # → secret-4        (channel-40)
    "07-tendermint-51",   # → phoenix-1       (channel-52)
    "07-tendermint-125",  # → neutron-1       (channel-123)
    "07-tendermint-129",  # → agoric-3        (channel-148) Expired
    "07-tendermint-133",  # → dydx-mainnet-1  (channel-160)
    "07-tendermint-137",  # → celestia        (channel-162, channel-163)
    "07-tendermint-142",  # → ssc-1           (channel-213)
    "07-tendermint-146",  # → laozi-mainnet   (channel-258)
]
blacklist_clients = []
whitelist_connections = []
blacklist_connections = []
whitelist_channels = []
blacklist_channels = []
state_refresh_interval = 1200
state_scan_timeout = 600

